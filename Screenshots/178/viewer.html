<!doctype html><html><head><meta charset="utf-8"><title>Task 178: keep these cliffs?</title>
<style>body{margin:0;background:#111;color:#eee;font:15px -apple-system,Helvetica,sans-serif}
#bar{padding:8px 12px;background:#222}#wrap{overflow:auto;height:calc(100vh - 80px)}
img{display:block;image-rendering:pixelated}b{color:#ffcc55}</style></head><body>
<div id="bar"><b id="t"></b> &nbsp; <span id="c"></span><br>
Keys: left/right = image, Space = BEFORE | AFTER, 1-4 = zoom (1 = fit width). Question: <b>keep these cliffs?</b></div>
<div id="wrap"><img id="im"></div>
<script>
const S=[["shot_cliff_after.png", "shot_cliff_before.png", "cliff: the 167 m face, looking up from 84 m. Space flips BEFORE (-cliffs 0) | AFTER. Right half: badlands' thin red/cream/ochre stripes become thick red layers; bottom: a dark blue-grey and a dark brown layer (24 m nominal) cross both biomes at the same height."], ["shot_coast_cliff_after.png", "shot_coast_cliff_before.png", "coast_cliff: lake + cliff from 223 m. Look at the face: one grey wall becomes grey with a red and a green (moss rock) layer with wavy boundaries; vertical fluting replaces the stepped 'contour' ripples."], ["shot_forest_breaks_after.png", "shot_forest_breaks_before.png", "forest_breaks: canyon wall from 163 m. Thick dark-brown, grey and (right, badlands) yellow/cream layers; check the small white dashes at mid-height near the centre (173's issue, still present)."], ["section_cliff.png", "", "cliff: vertical section through the face, 1 voxel = 1 px, uphill right. Left = before, right = after. Look at the face: small ledge steps, the wavy thick layers inside, the scree mound at the foot."], ["section_coast_cliff.png", "", "coast_cliff section, before | after."], ["section_forest_breaks.png", "", "forest_breaks section, before | after."], ["top_cliff.png", "", "cliff top view (0.4 m/px, north up), before | after: fluting along the face, scree apron at the foot."], ["top_coast_cliff.png", "", "coast_cliff top view, before | after."], ["top_forest_breaks.png", "", "forest_breaks top view, before | after."]];let i=0,after=true,zoom=1;
function show(){const s=S[i];const im=document.getElementById('im');im.src=after?s.after:s.before;
document.getElementById('t').textContent=(i+1)+'/'+S.length+'  '+s.name+'  ['+(after?'AFTER':'BEFORE')+']';
document.getElementById('c').textContent=s.caption;
im.style.width=zoom==1?'100%':(zoom*100)+'%';}
document.onkeydown=e=>{if(e.key=='ArrowRight')i=(i+1)%S.length;else if(e.key=='ArrowLeft')i=(i+S.length-1)%S.length;
else if(e.key==' '){after=!after;e.preventDefault();}else if('1234'.includes(e.key))zoom=+e.key;show();};show();
</script></body></html>

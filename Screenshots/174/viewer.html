const D=[{"n": "sun_still (frame 3)", "cap": "STILL TERRAIN, 16 h sun, clock still. Press 3/4 and flip Space between today 432, sc10 432 and sc10+mask 432: sc10 and sc10+mask are equally crisp (step outlines held), today's 432 is softer. The debug arm's top-middle panel (our mask) is black: the mask is 0 on every pixel.", "win": [1220, 580], "s": [["native 1080", "full/sun_still_native.png"], ["today 432", "full/sun_still_fsr3_432.png"], ["sc10 432", "full/sun_still_fsr3_432_sc10.png"], ["sc10+mask 432", "full/sun_still_fsr3_432_sc10_rm.png"], ["today 540", "full/sun_still_fsr3_540.png"], ["sc10 540", "full/sun_still_fsr3_540_sc10.png"], ["sc10+mask 540", "full/sun_still_fsr3_540_sc10_rm.png"], ["FSR debug view, sc10+mask 432", "full/sun_still_fsr3_432_sc10_rm_dbg.png"]]}, {"n": "torch_still (frame 3)", "cap": "STILL night torch camp. sc10+mask equals sc10 (crisper than today); the debug arm's top-middle panel is black (mask 0) -- a first version flagged ~5 % here (torch-lit sub-pixel steps), fixed by comparing neighbourhood RANGES.", "win": [640, 980], "s": [["native 1080", "full/torch_still_native.png"], ["today 432", "full/torch_still_fsr3_432.png"], ["sc10 432", "full/torch_still_fsr3_432_sc10.png"], ["sc10+mask 432", "full/torch_still_fsr3_432_sc10_rm.png"], ["today 540", "full/torch_still_fsr3_540.png"], ["sc10 540", "full/torch_still_fsr3_540_sc10.png"], ["sc10+mask 540", "full/torch_still_fsr3_540_sc10_rm.png"], ["FSR debug view, sc10+mask 432", "full/torch_still_fsr3_432_sc10_rm_dbg.png"]]}, {"n": "torch_move (frame 3)", "cap": "THE PROBLEM 171 FOUND. Torch moving 0.1 m/frame, bottom right (zoom 4). sc10 draws it twice with a bright speckle trail to its left; sc10+mask shows one torch, sharper than today and with no trail.", "win": [1350, 780], "s": [["native 1080", "full/torch_move_native.png"], ["today 432", "full/torch_move_fsr3_432.png"], ["sc10 432", "full/torch_move_fsr3_432_sc10.png"], ["sc10+mask 432", "full/torch_move_fsr3_432_sc10_rm.png"], ["today 540", "full/torch_move_fsr3_540.png"], ["sc10 540", "full/torch_move_fsr3_540_sc10.png"], ["sc10+mask 540", "full/torch_move_fsr3_540_sc10_rm.png"], ["FSR debug view, sc10+mask 432", "full/torch_move_fsr3_432_sc10_rm_dbg.png"]]}, {"n": "torch_on (frame 1)", "cap": "Frame after a torch is lit (5 m ahead, lower left). sc10 lags one frame (bright blotch); sc10+mask is closest to native.", "win": [380, 990], "s": [["native 1080", "full/torch_on_native.png"], ["today 432", "full/torch_on_fsr3_432.png"], ["sc10 432", "full/torch_on_fsr3_432_sc10.png"], ["sc10+mask 432", "full/torch_on_fsr3_432_sc10_rm.png"], ["today 540", "full/torch_on_fsr3_540.png"], ["sc10 540", "full/torch_on_fsr3_540_sc10.png"], ["sc10+mask 540", "full/torch_on_fsr3_540_sc10_rm.png"], ["FSR debug view, sc10+mask 432", "full/torch_on_fsr3_432_sc10_rm_dbg.png"]]}, {"n": "torch_off (frame 1)", "cap": "Frame after the torch goes out. The ground should be dark as in native: today keeps a soft glow, sc10 a brighter blotchy one, sc10+mask the least.", "win": [380, 990], "s": [["native 1080", "full/torch_off_native.png"], ["today 432", "full/torch_off_fsr3_432.png"], ["sc10 432", "full/torch_off_fsr3_432_sc10.png"], ["sc10+mask 432", "full/torch_off_fsr3_432_sc10_rm.png"], ["today 540", "full/torch_off_fsr3_540.png"], ["sc10 540", "full/torch_off_fsr3_540_sc10.png"], ["sc10+mask 540", "full/torch_off_fsr3_540_sc10_rm.png"], ["FSR debug view, sc10+mask 432", "full/torch_off_fsr3_432_sc10_rm_dbg.png"]]}, {"n": "lava_near (frame 3)", "cap": "Lava stream 7 m away, front advancing 0.1 m/frame (lower left, zoom 4). sc10 leaves dark holes and stale rock inside the new lava; sc10+mask is clean and crisper than today.", "win": [330, 950], "s": [["native 1080", "full/lava_near_native.png"], ["today 432", "full/lava_near_fsr3_432.png"], ["sc10 432", "full/lava_near_fsr3_432_sc10.png"], ["sc10+mask 432", "full/lava_near_fsr3_432_sc10_rm.png"], ["today 540", "full/lava_near_fsr3_540.png"], ["sc10 540", "full/lava_near_fsr3_540_sc10.png"], ["sc10+mask 540", "full/lava_near_fsr3_540_sc10_rm.png"], ["FSR debug view, sc10+mask 432", "full/lava_near_fsr3_432_sc10_rm_dbg.png"]]}, {"n": "lava_far (frame 3)", "cap": "Same lava stream 45 m away (centre, small; zoom 4). The new-voxel test catches far lava (emitters at any distance); sc10+mask is closest to native.", "win": [810, 870], "s": [["native 1080", "full/lava_far_native.png"], ["today 432", "full/lava_far_fsr3_432.png"], ["sc10 432", "full/lava_far_fsr3_432_sc10.png"], ["sc10+mask 432", "full/lava_far_fsr3_432_sc10_rm.png"], ["today 540", "full/lava_far_fsr3_540.png"], ["sc10 540", "full/lava_far_fsr3_540_sc10.png"], ["sc10+mask 540", "full/lava_far_fsr3_540_sc10_rm.png"], ["FSR debug view, sc10+mask 432", "full/lava_far_fsr3_432_sc10_rm_dbg.png"]]}, {"n": "torch_move_f (frame 3)", "cap": "Moving torch with the torch FLOOD on (task 172's recommendation). Same as without flood: sc10 doubles the torch, sc10+mask does not.", "win": [1350, 780], "s": [["native 1080", "full/torch_move_f_native.png"], ["today 432", "full/torch_move_f_fsr3_432.png"], ["sc10 432", "full/torch_move_f_fsr3_432_sc10.png"], ["sc10+mask 432", "full/torch_move_f_fsr3_432_sc10_rm.png"], ["today 540", "full/torch_move_f_fsr3_540.png"], ["sc10 540", "full/torch_move_f_fsr3_540_sc10.png"], ["sc10+mask 540", "full/torch_move_f_fsr3_540_sc10_rm.png"], ["FSR debug view, sc10+mask 432", "full/torch_move_f_fsr3_432_sc10_rm_dbg.png"]]}, {"n": "lava_near_f (frame 3)", "cap": "Near lava with the flood on: as lava_near.", "win": [330, 950], "s": [["native 1080", "full/lava_near_f_native.png"], ["today 432", "full/lava_near_f_fsr3_432.png"], ["sc10 432", "full/lava_near_f_fsr3_432_sc10.png"], ["sc10+mask 432", "full/lava_near_f_fsr3_432_sc10_rm.png"], ["today 540", "full/lava_near_f_fsr3_540.png"], ["sc10 540", "full/lava_near_f_fsr3_540_sc10.png"], ["sc10+mask 540", "full/lava_near_f_fsr3_540_sc10_rm.png"], ["FSR debug view, sc10+mask 432", "full/lava_near_f_fsr3_432_sc10_rm_dbg.png"]]}, {"n": "lava_far_f (frame 3)", "cap": "Far lava with the flood on: as lava_far.", "win": [810, 870], "s": [["native 1080", "full/lava_far_f_native.png"], ["today 432", "full/lava_far_f_fsr3_432.png"], ["sc10 432", "full/lava_far_f_fsr3_432_sc10.png"], ["sc10+mask 432", "full/lava_far_f_fsr3_432_sc10_rm.png"], ["today 540", "full/lava_far_f_fsr3_540.png"], ["sc10 540", "full/lava_far_f_fsr3_540_sc10.png"], ["sc10+mask 540", "full/lava_far_f_fsr3_540_sc10_rm.png"], ["FSR debug view, sc10+mask 432", "full/lava_far_f_fsr3_432_sc10_rm_dbg.png"]]}];let i=0,arm=0,zoom=0;const img=document.getElementById('img'),wrap=document.getElementById('wrap');
function show(){const p=D[i];const k=((arm%p.s.length)+p.s.length)%p.s.length;img.src=p.s[k][1];
document.getElementById('t').textContent=p.n;document.getElementById('arm').textContent=p.s[k][0]+'  ('+(k+1)+'/'+p.s.length+')';
document.getElementById('cap').textContent=p.cap;const z=[0,1,2,4][zoom];img.style.width=z?(1920*z)+'px':'100%';
if(z){wrap.scrollLeft=(p.win[0]+80)*z-wrap.clientWidth/2;wrap.scrollTop=(p.win[1]+45)*z-wrap.clientHeight/2}}
document.onkeydown=e=>{if(e.key=='ArrowRight'){i=(i+1)%D.length;arm=0}else if(e.key=='ArrowLeft'){i=(i+D.length-1)%D.length;arm=0}
else if(e.key==' '){arm+=e.shiftKey?-1:1;e.preventDefault()}else if('1234'.includes(e.key)){zoom=+e.key-1}else return;show()};
let dr=null;wrap.onmousedown=e=>{dr=[e.clientX,e.clientY,wrap.scrollLeft,wrap.scrollTop];e.preventDefault()};
onmouseup=()=>dr=null;onmousemove=e=>{if(dr){wrap.scrollLeft=dr[2]-(e.clientX-dr[0]);wrap.scrollTop=dr[3]-(e.clientY-dr[1])}};show();
</script></body></html>

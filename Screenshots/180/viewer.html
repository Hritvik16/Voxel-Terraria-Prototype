<!doctype html><html><head><meta charset="utf-8"><title>Task 180: voxel trees, OFF | ON</title>
<style>body{margin:0;background:#111;color:#eee;font:15px -apple-system,Helvetica,sans-serif}
#bar{padding:8px 12px;background:#222}#wrap{overflow:auto;height:calc(100vh - 84px)}
img{display:block;image-rendering:pixelated}b{color:#ffcc55}#err{color:#ff6666}</style></head><body>
<div id="bar"><b id="t"></b> &nbsp; <span id="c"></span> <span id="err"></span><br>
Keys: left/right = pose, Space = flip OFF/ON, B / A = OFF / ON, Z = zoom (fit width | 100 %).</div>
<div id="wrap"><img id="im"></div>
<script>
const S=[{"name": "fixed_forest", "caption": "forest, 45 m from the densest tree spot: look at the crowns on the ground in the middle -- oak, poplar, bushy fork", "files": ["fixed_forest_1_before.png", "fixed_forest_2_after.png"]}, {"name": "fixed_jungle", "caption": "jungle: emergent trees with flat umbrella crowns over round crowns and palms; buttressed trunks", "files": ["fixed_jungle_1_before.png", "fixed_jungle_2_after.png"]}, {"name": "fixed_savanna", "caption": "savanna: sparse flat-topped acacias and fat baobabs", "files": ["fixed_savanna_1_before.png", "fixed_savanna_2_after.png"]}, {"name": "fixed_snow", "caption": "snow: conifers (stacked cones) -- spruce, tall pine, fir", "files": ["fixed_snow_1_before.png", "fixed_snow_2_after.png"]}, {"name": "fixed_desert", "caption": "desert: a few cacti (saguaro / column / barrel), small at this distance", "files": ["fixed_desert_1_before.png", "fixed_desert_2_after.png"]}, {"name": "range_200up", "caption": "FAR VIEW from 1.5 km, 200 m up: forest texture in shells 2-5; beyond 2.2 km (shell 6+) and in the far band there are no trees", "files": ["range_200up_1_before.png", "range_200up_2_after.png"]}], A=["OFF (-trees 0)", "ON (-trees 1)"];let i=0,a=1,fit=true;
const im=document.getElementById('im');
im.onerror=()=>{document.getElementById('err').textContent=' MISSING FILE: '+im.getAttribute('src');};
function show(){const s=S[i];document.getElementById('err').textContent='';im.src=s.files[a];
document.getElementById('t').textContent=(i+1)+'/'+S.length+'  '+s.name+'  ['+A[a]+']';
document.getElementById('c').textContent=s.caption;im.style.width=fit?'100%':'auto';}
document.onkeydown=e=>{const k=e.key.toLowerCase();
if(k=='arrowright')i=(i+1)%S.length;else if(k=='arrowleft')i=(i+S.length-1)%S.length;
else if(k==' '){a=1-a;e.preventDefault();}else if(k=='b')a=0;else if(k=='a')a=1;
else if(k=='z')fit=!fit;show();};show();
</script></body></html>

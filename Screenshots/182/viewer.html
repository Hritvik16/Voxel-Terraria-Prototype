<!doctype html><html><head><meta charset="utf-8"><title>Task 182: material rules, deep stone + shell mosaic fixed</title>
<style>body{margin:0;background:#111;color:#eee;font:15px -apple-system,Helvetica,sans-serif}
#bar{padding:8px 12px;background:#222}#wrap{overflow:auto;height:calc(100vh - 84px)}
img{display:block;image-rendering:pixelated}b{color:#ffcc55}#err{color:#ff6666}</style></head><body>
<div id="bar"><b id="t"></b> &nbsp; <span id="c"></span> <span id="err"></span><br>
Keys: left/right = pose, Space = next arm, 1 / 2 / 3 = 182 ON / 180b ON / OFF, Z = zoom (fit width | 100 %).
Question: <b>keep the new material rules as the default?</b></div>
<div id="wrap"><img id="im"></div>
<script>
const S=[{"name": "cliff_forest", "caption": "Forest cliff, centre face: AFTER = BEFORE, still one flat brown granite wall (no deep stone there before either). Its flatness is geometry, a separate decision; not touched here.", "files": ["cliff_forest_182.png", "cliff_forest_180b.png", "cliff_forest_off.png"], "arms": ["AFTER: 182 ON (-matrules 1)", "BEFORE: 180b ON", "OFF (today, -matrules 0; 180b's launch)"]}, {"name": "cliff_desert", "caption": "Desert cliff: AFTER = BEFORE, orange sandstone top to bottom. The fix changes nothing where the face never reached the old 11-19 m deep band.", "files": ["cliff_desert_182.png", "cliff_desert_180b.png", "cliff_desert_off.png"], "arms": ["AFTER: 182 ON (-matrules 1)", "BEFORE: 180b ON", "OFF (today, -matrules 0; 180b's launch)"]}, {"name": "cliff_snow", "caption": "Snow cliff, left of centre: BEFORE's black box (deep blue slate in shade, in 0.8 m brick steps) is gone; AFTER the whole face is one grey schist.", "files": ["cliff_snow_182.png", "cliff_snow_180b.png", "cliff_snow_off.png"], "arms": ["AFTER: 182 ON (-matrules 1)", "BEFORE: 180b ON", "OFF (today, -matrules 0; 180b's launch)"]}, {"name": "bank", "caption": "River bank: AFTER = BEFORE (mud collar along the water). Nothing here was deep or bared by a shell.", "files": ["bank_182.png", "bank_180b.png", "bank_off.png"], "arms": ["AFTER: 182 ON (-matrules 1)", "BEFORE: 180b ON", "OFF (today, -matrules 0; 180b's launch)"]}, {"name": "border_bank", "caption": "Canyon at a biome border: the grey canyon walls (upper middle) lose BEFORE's dark-blue / black patches; the near banks are unchanged.", "files": ["border_bank_182.png", "border_bank_180b.png", "border_bank_off.png"], "arms": ["AFTER: 182 ON (-matrules 1)", "BEFORE: 180b ON", "OFF (today, -matrules 0; 180b's launch)"]}, {"name": "beach", "caption": "Beach, far hills LEFT: BEFORE's red / yellow / blue brick mosaic is gone. The layered grass / brown / ochre / grey faces that remain are vertical cut faces at the edge of loaded shell chunks (s3 1,623 of 2,001 missing after the 45 s wait); the black slab right of centre is a missing-chunk hole too (BEFORE had a dark slab over the water at the same pose).", "files": ["beach_182.png", "beach_180b.png", "beach_off.png"], "arms": ["AFTER: 182 ON (-matrules 1)", "BEFORE: 180b ON", "OFF (today, -matrules 0; 180b's launch)"]}, {"name": "oasis_or_swamp", "caption": "Desert river: AFTER = BEFORE (green grass + mud collar, the oasis rule).", "files": ["oasis_or_swamp_182.png", "oasis_or_swamp_180b.png", "oasis_or_swamp_off.png"], "arms": ["AFTER: 182 ON (-matrules 1)", "BEFORE: 180b ON", "OFF (today, -matrules 0; 180b's launch)"]}, {"name": "scree", "caption": "Scree: the face above the gravel apron was a wall of dark-blue / black boxes BEFORE (deep slate by depth, per brick); AFTER it is one grey schist face.", "files": ["scree_182.png", "scree_180b.png", "scree_off.png"], "arms": ["AFTER: 182 ON (-matrules 1)", "BEFORE: 180b ON", "OFF (today, -matrules 0; 180b's launch)"]}];let i=0,a=0,fit=true;
const im=document.getElementById('im');
im.onerror=()=>{document.getElementById('err').textContent=' MISSING FILE: '+im.getAttribute('src');};
function show(){const s=S[i];document.getElementById('err').textContent='';const k=Math.min(a,s.files.length-1);
im.src=s.files[k];document.getElementById('t').textContent=(i+1)+'/'+S.length+'  '+s.name+'  ['+s.arms[k]+']';
document.getElementById('c').textContent=s.caption;im.style.width=fit?'100%':'auto';}
document.onkeydown=e=>{const k=e.key.toLowerCase();
if(k=='arrowright')i=(i+1)%S.length;else if(k=='arrowleft')i=(i+S.length-1)%S.length;
else if(k==' '){a=(a+1)%S[i].files.length;e.preventDefault();}else if(k=='1')a=0;else if(k=='2')a=1;else if(k=='3')a=2;
else if(k=='z')fit=!fit;show();};show();
</script></body></html>

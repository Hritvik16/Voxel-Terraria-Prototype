<!doctype html><html><head><meta charset="utf-8"><title>Task 173 world-gen survey</title><style>

</style></head><body><div id="bar"><b id="t"></b> &nbsp; <span id="arm"></span> &nbsp;
<span style="color:#888">&larr;/&rarr; pose &middot; Space cycle native / FSR 3 540 (/ shape light) &middot; 1 fit &middot; 2 100% &middot; 3 200% &middot; 4 300% &middot; L list</span>

<script>
const D=[{"n": "1. start_walk", "note": "the play start, eye 1.6 m, free distance 1500 m; desert x alpine range", "find": "WEAK: the slope is one smooth surface under a two-tone camo dither (yellow cover vs grey rock in noise blobs); no outcrops, boulders or ledges at walking scale. GOOD: the long view to a coast and islets.", "s": [["native", "shots/ws_start_walk_native.png"], ["fsr3_540", "shots/ws_start_walk_fsr3_540.png"]]}, {"n": "2. start_view", "note": "the play start from 160 m back, 35 m up; sun-behind dot 1.00", "find": "WEAK: from 35 m up the start is a uniform slope of salt-and-pepper speckle; the orange badlands cover meets yellow savanna in a ragged noise seam. Nothing to walk toward in frame.", "s": [["native", "shots/ws_start_view_native.png"], ["fsr3_540", "shots/ws_start_view_fsr3_540.png"]]}, {"n": "3. pair_snow_river-plains", "note": "snow x river plains: 40656 cells (14.1 % of land); cell (596,724) landform depth 416 m, danger 2, band 0; sun-behind dot 1.00", "find": "WEAK: the river is a raised trapezoid CANAL (levee walls above the plain, straight runs, 45-degree kinks, stepped water slabs). The plain is flat white with no texture. GOOD: the mesa on the horizon.", "s": [["native", "shots/ws_pair_snow_river-plains_native.png"], ["fsr3_540", "shots/ws_pair_snow_river-plains_fsr3_540.png"]]}, {"n": "4. pair_desert_wetland-basin", "note": "desert x wetland basin: 28665 cells (9.9 % of land); cell (362,566) landform depth 480 m, danger 2, band 3; sun-behind dot 0.00", "find": "WEAK: cap-rock ledge undercuts read as EGG shapes with contour-ring moire on the walls; a black hole under one; zig-zag river. GOOD: a sandy valley between steep walls is a real place.", "s": [["native", "shots/ws_pair_desert_wetland-basin_native.png"], ["fsr3_540", "shots/ws_pair_desert_wetland-basin_fsr3_540.png"]]}, {"n": "5. pair_desert_canyonlands", "note": "desert x canyonlands: 23802 cells (8.2 % of land); cell (588,350) landform depth 480 m, danger 3, band 0; sun-behind dot 1.00", "find": "WEAK: 'canyonlands' shows NO canyons -- a rolling sand sheet with a dead-straight river channel. The landform's signature is missing at this scale.", "s": [["native", "shots/ws_pair_desert_canyonlands_native.png"], ["fsr3_540", "shots/ws_pair_desert_canyonlands_fsr3_540.png"]]}, {"n": "6. pair_desert_alpine-range", "note": "desert x alpine range: 21102 cells (7.3 % of land); cell (484,478) landform depth 480 m, danger 6, band 2; sun-behind dot 1.00", "find": "WEAK: an alpine range that reads as a sand pile: rounded noisy lump, two-tone orange/sand camo, no rock, cliffs or ridges.", "s": [["native", "shots/ws_pair_desert_alpine-range_native.png"], ["fsr3_540", "shots/ws_pair_desert_alpine-range_fsr3_540.png"]]}, {"n": "7. pair_forest_breaks", "note": "forest x breaks: 17654 cells (6.1 % of land); cell (434,720) landform depth 352 m, danger 1, band 3; sun-behind dot 1.00", "find": "WEAK: a 100 m grey wall of smooth blobby forms, one rock material, scalloped ledge shadows, faint white dash artefacts on the face. GOOD: scale.", "s": [["native", "shots/ws_pair_forest_breaks_native.png"], ["fsr3_540", "shots/ws_pair_forest_breaks_fsr3_540.png"]]}, {"n": "8. pair_snow_rolling-highlands", "note": "snow x rolling highlands: 14416 cells (5.0 % of land); cell (732,446) landform depth 256 m, danger 2, band 0; sun-behind dot 1.00", "find": "WEAK: snow, bright green grass and red badlands meet on the same level ground in dithered noise seams; a lone grey slab stamp; straight river. GOOD: striped mesas on the horizon, the crater lake.", "s": [["native", "shots/ws_pair_snow_rolling-highlands_native.png"], ["fsr3_540", "shots/ws_pair_snow_rolling-highlands_fsr3_540.png"]]}, {"n": "9. pair_snow_high-plateau", "note": "snow x high plateau: 14337 cells (5.0 % of land); cell (344,392) landform depth 480 m, danger 2, band 0; sun-behind dot 1.00", "find": "WEAK: zig-zag polyline river (45-degree segments); the stone hoop stands alone on a flat plain; grass/snow seam is a noise dither. GOOD: domed striped knoll on the horizon.", "s": [["native", "shots/ws_pair_snow_high-plateau_native.png"], ["fsr3_540", "shots/ws_pair_snow_high-plateau_fsr3_540.png"]]}, {"n": "10. pair_snow_breaks", "note": "snow x breaks: 13296 cells (4.6 % of land); cell (256,450) landform depth 256 m, danger 3, band 1; sun-behind dot 0.92", "find": "WEAK: 'breaks' (gullied hills) reads as lumpy snow; the river is a straight blue slab cut into the hillside.", "s": [["native", "shots/ws_pair_snow_breaks_native.png"], ["fsr3_540", "shots/ws_pair_snow_breaks_fsr3_540.png"]]}, {"n": "11. pair_badlands_rolling-highlands", "note": "badlands x rolling highlands: 9836 cells (3.4 % of land); cell (730,426) landform depth 320 m, danger 1, band 0; sun-behind dot 1.00", "find": "GOOD: crater lake with a red rim, striped buttes behind. WEAK: flat salmon ground, green/white dither patches, a lone grey slab stamp.", "s": [["native", "shots/ws_pair_badlands_rolling-highlands_native.png"], ["fsr3_540", "shots/ws_pair_badlands_rolling-highlands_fsr3_540.png"]]}, {"n": "12. pair_forest_river-plains", "note": "forest x river plains: 9726 cells (3.4 % of land); cell (456,280) landform depth 384 m, danger 0, band 0; sun-behind dot 1.00", "find": "WEAK: a lawn to the horizon (uniform grass carpet, no trees yet -- placement phase), straight river, snow beside grass at the same height. GOOD: the coast and bay beyond.", "s": [["native", "shots/ws_pair_forest_river-plains_native.png"], ["fsr3_540", "shots/ws_pair_forest_river-plains_fsr3_540.png"]]}, {"n": "13. pair_forest_volcanic", "note": "forest x volcanic: 9564 cells (3.3 % of land); cell (640,464) landform depth 448 m, danger 2, band 0; sun-behind dot 1.00", "find": "GOOD: the best natural-looking frame -- gorge, lake, waterfalls, cliffs, varied biomes. WEAK: waterfalls are stair-stepped white blocks, grey cliffs featureless.", "s": [["native", "shots/ws_pair_forest_volcanic_native.png"], ["fsr3_540", "shots/ws_pair_forest_volcanic_fsr3_540.png"]]}, {"n": "14. pair_jungle_dune-sea", "note": "jungle x dune sea: 8723 cells (3.0 % of land); cell (518,628) landform depth 480 m, danger 3, band 0; sun-behind dot 1.00", "find": "WEAK: 'dune sea' under jungle is a flat lawn -- the landform does not show outside sand; the geyser basin is a perfect flat white ellipse with round pools (reads man-made). GOOD: the mountain backdrop.", "s": [["native", "shots/ws_pair_jungle_dune-sea_native.png"], ["fsr3_540", "shots/ws_pair_jungle_dune-sea_fsr3_540.png"]]}, {"n": "15. pair_savanna_alpine-range", "note": "savanna x alpine range: 7628 cells (2.6 % of land); cell (504,502) landform depth 448 m, danger 3, band 2; sun-behind dot 1.00", "find": "WEAK: the whole frame is one smooth slope under speckle camo; savanna/badlands blend is noise.", "s": [["native", "shots/ws_pair_savanna_alpine-range_native.png"], ["fsr3_540", "shots/ws_pair_savanna_alpine-range_fsr3_540.png"]]}, {"n": "16. pair_savanna_breaks", "note": "savanna x breaks: 7048 cells (2.4 % of land); cell (416,684) landform depth 256 m, danger 1, band 3; sun-behind dot 0.00", "find": "GOOD: a lake in a cut, layered breaks, coast beyond. WEAK: grass/savanna seam is a pixel dither.", "s": [["native", "shots/ws_pair_savanna_breaks_native.png"], ["fsr3_540", "shots/ws_pair_savanna_breaks_fsr3_540.png"]]}, {"n": "17. pair_badlands_high-plateau", "note": "badlands x high plateau: 5769 cells (2.0 % of land); cell (368,430) landform depth 416 m, danger 0, band 0; sun-behind dot 1.00", "find": "WEAK: flat salmon ground; a river segment that rises out of the ground as a bent pipe; a dark slit stamp. GOOD: striped butte at left.", "s": [["native", "shots/ws_pair_badlands_high-plateau_native.png"], ["fsr3_540", "shots/ws_pair_badlands_high-plateau_fsr3_540.png"]]}, {"n": "18. pair_forest_dune-sea", "note": "forest x dune sea: 4561 cells (1.6 % of land); cell (498,618) landform depth 384 m, danger 1, band 0; sun-behind dot 0.71", "find": "WEAK: no dunes; uniform grass. GOOD: lakes, mountains behind.", "s": [["native", "shots/ws_pair_forest_dune-sea_native.png"], ["fsr3_540", "shots/ws_pair_forest_dune-sea_fsr3_540.png"]]}, {"n": "19. pair_desert_volcanic", "note": "desert x volcanic: 4386 cells (1.5 % of land); cell (650,434) landform depth 256 m, danger 4, band 3; sun-behind dot 1.00", "find": "GOOD: a dramatic red gorge with a river and a waterfall. WEAK: the river steps down in boxy tiles; the waterfall is a solid tube; a black-mouthed egg ledge at right.", "s": [["native", "shots/ws_pair_desert_volcanic_native.png"], ["fsr3_540", "shots/ws_pair_desert_volcanic_fsr3_540.png"]]}, {"n": "20. pair_savanna_dune-sea", "note": "savanna x dune sea: 4335 cells (1.5 % of land); cell (494,612) landform depth 320 m, danger 1, band 1; sun-behind dot 1.00", "find": "WEAK: no dunes; lawn with straight lake edges. GOOD: the mountain wall behind has variety (green, ochre, red).", "s": [["native", "shots/ws_pair_savanna_dune-sea_native.png"], ["fsr3_540", "shots/ws_pair_savanna_dune-sea_fsr3_540.png"]]}, {"n": "21. feature_great-peak-0", "note": "great-peak-0 (radius 840 m) from 1644 m, 80 m up; sun-behind dot 1.00", "find": "WEAK: the 600 m summit is a smooth cone; biome seam runs straight down it (ochre | red); no snow cap, no ridges or aretes; streams run straight down as stepped lines.", "s": [["native", "shots/ws_feature_great-peak-0_native.png"], ["fsr3_540", "shots/ws_feature_great-peak-0_fsr3_540.png"]]}, {"n": "22. feature_great-canyon-1", "note": "great-canyon-1 from inside: path point 19/57, 25 m over the floor, looking down the path", "find": "GOOD: a sandy canyon floor between red walls. WEAK: disc-shaped ledge with a black undercut on the right wall.", "s": [["native", "shots/ws_feature_great-canyon-1_native.png"], ["fsr3_540", "shots/ws_feature_great-canyon-1_fsr3_540.png"]]}, {"n": "23. feature_great-canyon-1_out", "note": "great-canyon-1 from 600 m, 120 m up; sun-behind dot 1.00", "find": "WEAK: from outside the canyon is a ruler-straight trench with parallel walls; the river beside it has 90/45-degree bends.", "s": [["native", "shots/ws_feature_great-canyon-1_out_native.png"], ["fsr3_540", "shots/ws_feature_great-canyon-1_out_fsr3_540.png"]]}, {"n": "24. feature_great-canyon-2", "note": "great-canyon-2 from inside: path point 16/48, 25 m over the floor, looking down the path", "find": "GOOD: scale and depth. WEAK: walls are smooth grey with 8 m checker blotches; the river is a stair of tiles; a waterfall reads as a solid blue sheet.", "s": [["native", "shots/ws_feature_great-canyon-2_native.png"], ["fsr3_540", "shots/ws_feature_great-canyon-2_fsr3_540.png"]]}, {"n": "25. feature_great-canyon-2_out", "note": "great-canyon-2 from 600 m, 120 m up; sun-behind dot 0.71", "find": "WEAK: two parallel dead-straight rivers inside a straight trench in a snow plain.", "s": [["native", "shots/ws_feature_great-canyon-2_out_native.png"], ["fsr3_540", "shots/ws_feature_great-canyon-2_out_fsr3_540.png"]]}, {"n": "26. feature_mesa-3", "note": "mesa-3 (radius 485 m) from 1077 m, 80 m up; sun-behind dot 0.92", "find": "GOOD: reads as a landmark; banded flank. WEAK: the bands are smooth wavy grey stripes; top is flat lawn.", "s": [["native", "shots/ws_feature_mesa-3_native.png"], ["fsr3_540", "shots/ws_feature_mesa-3_fsr3_540.png"]]}, {"n": "27. feature_mesa-4", "note": "mesa-4 (radius 401 m) from 942 m, 80 m up; sun-behind dot 1.00", "find": "GOOD: a clear three-tier table mountain silhouette. WEAK: tiers identical; rivers round it form a canal grid with right-angle bends.", "s": [["native", "shots/ws_feature_mesa-4_native.png"], ["fsr3_540", "shots/ws_feature_mesa-4_fsr3_540.png"]]}, {"n": "28. coast_cliff", "note": "coast cell (482,730), ground -320 m over the sea 240 m inland; from 220 m offshore, 40 m over the sea", "find": "GOOD: a real sea cliff with a bay. WEAK: the cliff is one grey material with vertical streaks; contour-ring moire on the curved face at left; snow beach.", "s": [["native", "shots/ws_coast_cliff_native.png"], ["fsr3_540", "shots/ws_coast_cliff_fsr3_540.png"]]}, {"n": "29. coast_typ", "note": "coast cell (216,688), ground -509 m over the sea 240 m inland; from 220 m offshore, 25 m over the sea", "find": "GOOD: sand islet with shallow-water tint. WEAK: the coast is flat shoals; a hard colour seam crosses the sea (render, not gen).", "s": [["native", "shots/ws_coast_typ_native.png"], ["fsr3_540", "shots/ws_coast_typ_fsr3_540.png"]]}, {"n": "30. range_200up", "note": "the highest map cell (482,458) at 1095 m, from 1.5 km, 200 m over the ground there", "find": "WEAK: the range is one cone plus smaller cones; a vertical biome seam; no snowline; no valleys or ridgelines between peaks.", "s": [["native", "shots/ws_range_200up_native.png"], ["fsr3_540", "shots/ws_range_200up_fsr3_540.png"]]}, {"n": "31. river", "note": "river cell (525,624) score 80 (size + valley m), 150 m along its axis, 25 m up", "find": "WEAK: the target river is behind a flat white geyser-basin ellipse; distant lakes and rivers look acceptable. GOOD: lake chain in the valley.", "s": [["native", "shots/ws_river_native.png"], ["fsr3_540", "shots/ws_river_fsr3_540.png"]]}, {"n": "32. cliff", "note": "Sheer cell (426,710), 167 m drop over 48 m, from 70 m out", "find": "WEAK: the tallest sun-lit Sheer face: 167 m of one smooth grey material, no strata, no ledges or cracks, a few grass strings.", "s": [["native", "shots/ws_cliff_native.png"], ["fsr3_540", "shots/ws_cliff_fsr3_540.png"]]}, {"n": "33. cave_mouth", "note": "nearest land CaveMouth stamp, 340 m from the start, tube radius 6.0 m; 25 m outside looking in", "find": "WEAK: the nearest cave mouth sits on a steep slope and shows only as a black sliver; up close the slope is a smooth voxel staircase with yellow moss blobs.", "s": [["native", "shots/ws_cave_mouth_native.png"], ["fsr3_540", "shots/ws_cave_mouth_fsr3_540.png"]]}, {"n": "34. cave_in", "note": "20 m down the CaveMouth tube, looking deeper", "find": "WEAK: on a steep slope the cave tube becomes an OPEN TRENCH, not a cave; its shaded walls are pure black at noon (lighting). GOOD: the view out over the island.", "s": [["native", "shots/ws_cave_in_native.png"], ["fsr3_540", "shots/ws_cave_in_fsr3_540.png"]]}, {"n": "35. tunnel", "note": "the most open enclosed air 40 m under the start's ground (2 m store scan); scan: eye (4011.3, 850.8, 4038.9), free 9 m ahead, ceiling 1.3 m", "find": "Play lighting: black. Shape light: a smooth worm tube, one material, uniform cross-section -- bland.", "s": [["native", "shots/ws_tunnel_native.png"], ["fsr3_540", "shots/ws_tunnel_fsr3_540.png"], ["native_lit", "shots/ws_tunnel_native_lit.png"]]}, {"n": "36. cavern", "note": "the most open enclosed air 200 m below sea level under the start (2 m store scan); scan: eye (4055.3, 311.6, 4046.9), free 56 m ahead, ceiling 27.0 m", "find": "Play lighting: black. Shape light: a large chamber (56 m free) with a smooth contour-ringed floor, one grey material, a few red ore streaks; no columns, stalactites, water or features.", "s": [["native", "shots/ws_cavern_native.png"], ["fsr3_540", "shots/ws_cavern_fsr3_540.png"], ["native_lit", "shots/ws_cavern_native_lit.png"]]}];let i=0,arm=0,zoom=0;const img=document.getElementById('img'),wrap=document.getElementById('wrap');
const AN={native:'native 1080 (no upscaler)',fsr3_540:'FSR 3 at 540 rows (play)',native_lit:'native + capture-only SHAPE light (cave ambient floor 1.0)'};
function show(){const p=D[i];const k=arm%p.s.length;img.src=p.s[k][1];
document.getElementById('t').textContent=p.n;document.getElementById('arm').textContent=AN[p.s[k][0]]+'  ('+(k+1)+'/'+p.s.length+')';
document.getElementById('find').textContent=p.find;document.getElementById('note').textContent=p.note;
img.style.width=zoom?(1920*zoom)+'px':'100%';[...document.querySelectorAll('#list div')].forEach((d,k)=>d.className=k==i?'on':'');}
const L=document.getElementById('list');D.forEach((p,k)=>{const d=document.createElement('div');d.textContent=p.n;d.onclick=()=>{i=k;show()};L.appendChild(d)});
document.onkeydown=e=>{if(e.key=='ArrowRight'){i=(i+1)%D.length;arm=0}else if(e.key=='ArrowLeft'){i=(i+D.length-1)%D.length;arm=0}
else if(e.key==' '){arm++;e.preventDefault()}else if('1234'.includes(e.key)){zoom=+e.key-1}
else if(e.key=='l'||e.key=='L'){L.style.display=L.style.display=='none'?'':'none'}else return;show()};
let dr=null;wrap.onmousedown=e=>{dr=[e.clientX,e.clientY,wrap.scrollLeft,wrap.scrollTop];e.preventDefault()};
onmouseup=()=>dr=null;onmousemove=e=>{if(dr){wrap.scrollLeft=dr[2]-(e.clientX-dr[0]);wrap.scrollTop=dr[3]-(e.clientY-dr[1])}};show();
</script></body></html>
